<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Bolso Jovem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="pagina-login">

  <main class="login">

    <!-- ===================== LADO ESQUERDO (marca) ===================== -->
    <section class="login-lado">
      <span class="forma forma-1"></span>
      <span class="forma forma-2"></span>
      <span class="forma forma-3"></span>
      <span class="forma forma-4"></span>

      <div class="login-marca">
        <div class="logo logo-grande">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 7 L18 3 L18 7 Z" fill="#0b4fc1"/>
            <rect x="2" y="7" width="20" height="15" rx="4" fill="#0b4fc1"/>
            <circle cx="16.5" cy="14.5" r="2" fill="#fff"/>
          </svg>
          <span>Bolso<br><em>Jovem</em></span>
        </div>

        <p class="login-frase">Aprenda, planeje e conquiste seus objetivos financeiros</p>

        <ul class="login-vantagens">
          <li><span class="vantagem-icone"><svg viewBox="0 0 24 24"><path d="M4 20V14M9 20V10M14 20v-6M3 11l6-5 4 3 8-6M16 3h5v5"/></svg></span>Controle suas finanças</li>
          <li><span class="vantagem-icone"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5"/></svg></span>Aprenda sobre investimentos</li>
          <li><span class="vantagem-icone"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg></span>Realize seus planos</li>
        </ul>

        <svg class="porquinho-login" viewBox="0 0 120 100" aria-hidden="true">
          <circle cx="64" cy="12" r="10" fill="#6b9cff"/>
          <path d="M20 52c0-18 18-30 42-30s42 12 42 30-12 28-24 30v14H68V86H52v10H40V80c-12-4-20-14-20-28z" fill="#6b9cff"/>
          <path d="M72 24l12-10 2 16z" fill="#6b9cff"/>
          <rect x="100" y="44" width="12" height="16" rx="4" fill="#6b9cff"/>
          <rect x="54" y="28" width="18" height="4" rx="2" fill="#eef2fc"/>
          <circle cx="86" cy="44" r="3" fill="#eef2fc"/>
        </svg>
      </div>
    </section>

    <!-- ===================== LADO DIREITO (formulário) ===================== -->
    <section class="login-form-area">
      <form id="form-login" class="login-form" novalidate>
        <h1>Bem-vindo de volta!</h1>
        <p class="login-sub">Acesse sua conta e continue sua jornada com Bolso Jovem.</p>

        <label class="campo-icone">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6z"/></svg>
          <input type="text" id="usuario" placeholder="Seu e-mail ou usuário" autocomplete="username" aria-label="E-mail ou usuário">
        </label>

        <label class="campo-icone">
          <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" aria-label="Senha">
          <button type="button" id="btn-ver-senha" class="btn-olho-senha" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="risco" d="M3 3l18 18"/></svg>
          </button>
        </label>

        <div class="login-opcoes">
          <label class="lembrar"><input type="checkbox" checked> Lembrar de mim</label>
          <a href="#">Esqueceu a senha?</a>
        </div>

        <p id="erro-login" class="erro" role="alert"></p>

        <button type="submit" class="btn-entrar">Entrar <span aria-hidden="true">→</span></button>

        <div class="ou"><span>ou</span></div>

        <button type="button" id="btn-google" class="btn-google">
          <span class="g" aria-hidden="true">G</span> Entrar com Google
        </button>

        <p class="cadastro">Ainda não tem uma conta? <a href="#">Cadastre-se</a></p>
      </form>
    </section>
  </main>

  <script src="../assets/js/pages/login.js"></script>
</body>
</html>
